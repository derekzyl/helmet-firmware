; PlatformIO Project Configuration File for Smart Helmet Unit
; ESP32 DevKit (38-pin), Arduino Framework + Native Unit Testing

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    mikalhart/TinyGPSPlus @ ^1.0.3
    links2004/WebSockets @ ^2.4.1
    electroniccats/MPU6050 @ ^1.3.1
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D HELMET_FIRMWARE
    -D CONFIG_BT_ENABLED
    -O2

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -D UNIT_TEST
    -D NATIVE_TEST
